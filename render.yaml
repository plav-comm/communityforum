# ============================================================
# Render blueprint for Community-Span.
#
# To use it: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this
# file and creates the web service and the daily cron job for you.
#
# You still paste the secret values (DATABASE_URL, YOUTUBE_API_KEY,
# WEBSUB_SECRET, WEBSUB_VERIFY_TOKEN, ADMIN_TOKEN) into the dashboard —
# they are marked sync:false below so they are never stored in git.
# ============================================================
services:
  - type: web
    name: community-span
    runtime: node
    plan: starter                 # ~$7/mo, always on. 'free' spins down and
                                  # will miss push notifications while asleep.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: community-span
          property: host          # Render fills in https://<host> for you
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: WEBSUB_SECRET
        sync: false
      - key: WEBSUB_VERIFY_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  - type: cron
    name: community-span-daily
    runtime: node
    plan: starter
    schedule: '0 8 * * *'         # 08:00 UTC daily = 4am ET / 1am PT
    buildCommand: npm ci
    startCommand: npm run daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: community-span
          property: host
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: WEBSUB_SECRET
        sync: false
      - key: WEBSUB_VERIFY_TOKEN
        sync: false
